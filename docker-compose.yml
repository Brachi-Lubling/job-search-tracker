services:
  db:
    image: postgres:16-alpine
    container_name: cv-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvuser
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: cvplatform
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - cv_pgdata:/var/lib/postgresql/data

volumes:
  cv_pgdata:
